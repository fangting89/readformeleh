[project]
name = "readformeleh"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "twilio>=9.3",
    "python-dotenv>=1.0",
    "pillow>=10.4",
    "requests>=2.32",
    "python-multipart>=0.0.9",
    "streamlit>=1.60.0",
    "lehcore",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Git dependency, not a local path: a Streamlit Community Cloud deploy only
# clones this repo, not sibling directories, so a path source would break
# the deployed build even though it works fine locally.
[tool.uv.sources]
lehcore = { git = "https://github.com/fangting89/lehcore" }
