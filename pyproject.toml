[project]
name = "read-leh"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "twilio>=9.3",
    "python-dotenv>=1.0",
    "pillow>=10.4",
    "requests>=2.32",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
